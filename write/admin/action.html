<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>계정 확인</title>
    <link rel="stylesheet" href="../../style.css" />
    <script type="module" src="./action.js"></script>
  </head>
  <body>
    <main class="container">
      <h1 id="title">계정 확인</h1>
      <p id="status" role="status">링크 확인 중</p>
      <form id="import-link" class="panel">
        <label>메일의 링크 주소<input name="link" type="url" required autocomplete="off" /></label>
        <button>링크 확인</button>
      </form>
      <section id="action" class="panel" hidden>
        <p id="email"></p>
        <form id="reset-password" hidden>
          <label
            >새 비밀번호<input
              name="password"
              type="password"
              minlength="12"
              required
              autocomplete="new-password"
          /></label>
          <label
            >새 비밀번호 확인<input
              name="confirmation"
              type="password"
              minlength="12"
              required
              autocomplete="new-password"
          /></label>
          <p class="muted">12자 이상</p>
          <button>비밀번호 저장</button>
        </form>
        <button id="confirm-email" hidden>확인</button>
      </section>
      <p><a id="return" href="./">관리자 로그인</a></p>
    </main>
  </body>
</html>
